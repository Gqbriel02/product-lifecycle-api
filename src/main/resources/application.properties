spring.application.name=product-lifecycle-api
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ProductDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=admin
spring.datasource.password=admin
server.port=8080

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# (Optional) Show SQL logs in console
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# (Optional) Hibernate DDL auto setting
spring.jpa.hibernate.ddl-auto=update


logging.level.org.springframework.security=DEBUG


